# vim:fileencoding=utf-8:foldmethod=marker

action_alias new_tab   launch --type=tab --cwd=~/code --location=last
action_alias clone_tab launch --type=tab --cwd=current --location=after

map ctrl+t new_tab
map ctrl+d clone_tab
map ctrl+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map shift+f5 load_config_file
map kitty_mod+f5

# Windows-style word movement. Bash readline already binds these sequences.
map ctrl+left send_text all \e[1;5D
map ctrl+right send_text all \e[1;5C
map ctrl+backspace send_text all \e\x7f
map ctrl+delete send_text all \ed

# kitty.conf generated by Confitty, https://confitty.app
# Target: Kitty 0.48.0
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family "Fira Code Retina"
font_size 12
disable_ligatures cursor
modify_font cell_height 120%

# --- Cursor ---
cursor #c9d1d9
cursor_text_color #0d1117
cursor_shape beam
cursor_beam_thickness 1
cursor_blink_interval 0.5

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
mouse_hide_wait 1
url_color #7aa2f7
underline_hyperlinks always
copy_on_select yes
mouse_map right press ungrabbed paste_from_clipboard
strip_trailing_spaces smart

# --- Performance ---
repaint_delay 15

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.2

# --- Window Layout ---
remember_window_size no
initial_window_width  140c
initial_window_height 30c
window_border_width 1pt
window_padding_width 8
active_border_color #bb9af7
inactive_text_alpha 0.7
hide_window_decorations no
confirm_os_window_close 0

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #1a1b26
active_tab_background #bb9af7
inactive_tab_foreground #565f89
inactive_tab_background #24283b

# --- Colors ---
foreground #c9d1d9
background #0d1117
selection_foreground #0d1117
selection_background #3b3b3b
color0 #24292f
color1 #ff7b72
color2 #7ee787
color3 #ffa657
color4 #79c0ff
color5 #d2a8ff
color6 #56d4dd
color7 #f0f6fc
color8 #8c959f
color9 #ff7b72
color10 #7ee787
color11 #ffa657
color12 #79c0ff
color13 #d2a8ff
color14 #56d4dd
color15 #f0f6fc

# --- Advanced ---
allow_remote_control socket-only
